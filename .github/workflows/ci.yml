name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        ports: ["5432:5432"]
        env:
          POSTGRES_USER: theatre
          POSTGRES_PASSWORD: integration_only_password
          POSTGRES_DB: theatrebook_tests
        options: >-
          --health-cmd "pg_isready -U theatre -d theatrebook_tests"
          --health-interval 5s --health-timeout 5s --health-retries 15
    env:
      TEST_DB_CONNECTION: Host=localhost;Port=5432;Database=theatrebook_tests;Username=theatre;Password=integration_only_password
      Security__JwtKey: CI-Only-Key-Not-A-Deployment-Secret-Change-Me-2026
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: dotnet restore PADO.TheatreBook.slnx
      - name: Build
        run: dotnet build PADO.TheatreBook.slnx -c Release --no-restore
      - name: Test (PostgreSQL integration + unit)
        run: dotnet test PADO.TheatreBook.slnx -c Release --no-build --logger "console;verbosity=normal"
